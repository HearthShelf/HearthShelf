# Shared proxy behavior for every ABS-bound location. Included from
# default.conf. ${ABS_SERVER_URL} / ${PUBLIC_URL} are substituted by the
# entrypoint's envsubst pass at container start. See docs/reverse-proxy.md.

# Tell ABS its public identity so it generates correct absolute URLs itself.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;

# Upstream TLS (only relevant when ABS_SERVER_URL is https://).
# nginx sends NO SNI on upstream TLS by default, so any ABS behind a host that
# selects its certificate by SNI - Cloudflare, most reverse proxies, any shared
# IP - aborts the handshake with "SSL alert number 40" and every request 502s.
# proxy_ssl_server_name sends the SNI; proxy_ssl_name pins it to the hostname in
# ABS_SERVER_URL rather than the browser's Host, which we rewrite above.
proxy_ssl_server_name on;
proxy_ssl_name ${ABS_SERVER_HOST};

# Websocket upgrade support (ABS socket.io + SPA socket).
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Streams can be long-lived; don't cut them off early.
proxy_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# Safety net: rewrite redirects that carry the internal ABS host so the public
# origin reaches the browser / native client. Scoped to the ABS host ONLY - a
# blanket catch-all would hijack legitimate external redirects (e.g. an OIDC
# bounce to the identity provider's login page).
proxy_redirect ${ABS_SERVER_URL}/ ${PUBLIC_URL}/;
proxy_redirect default;
