name: Dev release

# Every push to the default branch publishes a fresh development image.
on:
  push:
    branches: [main, master]
  # Manual fallback for when a push fails to dispatch a run.
  workflow_dispatch:

concurrency:
  group: dev-release
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push :canary (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # slim -> hearthshelf ; aio -> hearthshelf-aio
          - variant: slim
            target: slim
            image: ${{ github.repository }}
          - variant: aio
            target: aio
            image: ${{ github.repository }}-aio
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # packages/core is a git submodule the image build needs
          fetch-depth: 0 # need tags to derive the canary version below

      # The version a canary image reports at runtime. Built as
      # "<last-tag>+canary.<sha>" so it is directly comparable to a release:
      # everything before '+' is real semver, and semver says build metadata does
      # NOT affect precedence - so a canary cut from 0.2.2 compares EQUAL to
      # 0.2.2, and one cut from 0.2.1 compares older. The '+canary.<sha>' tail is
      # what lets a client label it as a development build and identify the exact
      # commit. Falls back to 0.0.0 on a repo with no tags yet.
      - name: Compute canary version
        id: ver
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)"
          echo "value=${LAST_TAG}+canary.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          # canary (moving) + main-<shortsha> (immutable pin).
          tags: |
            type=raw,value=canary
            type=sha,prefix=main-,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HS_BUILD_VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
